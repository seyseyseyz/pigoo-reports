<script>
async function openReport(blob, hash, store, path) {
  const bytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  let k = /^#k=[A-Za-z0-9_-]{43}$/.test(hash) ? hash.slice(3) : '';
  try { if (k) store.setItem('k:' + path, k); else k = store.getItem('k:' + path) || ''; } catch (e) {}
  if (!k) throw new Error('no key');
  const data = bytes(blob);
  const key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: data.slice(0, 12)}, key, data.slice(12));
  return new TextDecoder().decode(plain);
}

openReport(document.getElementById('d').textContent, location.hash, sessionStorage, location.pathname)
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => { document.getElementById('m').textContent = '这个链接不完整，打不开。请从群里的卡片重新点开。'; });
</script></body></html>
